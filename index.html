<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2230">
<title>Cozy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- the pink bar -->
<header class="bar">
  <button id="btnMenu"  class="pill"  aria-haspopup="dialog">≡ MENU</button>
  <div class="titlebar"><span id="barTitle">cozy ✿</span></div>
  <button id="btnNew"   class="pill pill-accent" title="start a new chat">+ NEW</button>
</header>

<!-- the chat -->
<main id="chat" class="chat" aria-live="polite"></main>

<!-- typing -->
<form id="composer" class="composer">
  <span class="prompt" aria-hidden="true">❯</span>
  <input id="input" type="text" autocomplete="off" enterkeyhint="send"
         placeholder="ask me anything…" aria-label="your message">
  <button id="btnSend" class="pill pill-send" type="submit" aria-label="send">➤</button>
</form>

<!-- menu sheet -->
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-label="menu">
    <h3 id="sheetTitle">✿ &nbsp;Cozy menu</h3>
    <div id="sheetBody"><!-- filled by js --></div>
  </div>
</div>

<!-- "status" line under the composer (errors, thinking) -->
<div id="flash" class="flash" hidden></div>

<script src="js/providers.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
